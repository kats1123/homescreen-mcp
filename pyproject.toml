[project]
name = "homescreen-mcp"
version = "1.1.0"
description = "Arrange your iPhone Home Screen from your Mac: drag-and-drop app, CLI and MCP server. Keeps App Library apps in the App Library."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Jonathan Kats" }]
requires-python = ">=3.11"
keywords = ["iphone", "ios", "home screen", "springboard", "mcp", "app library", "screen time"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = ["pymobiledevice3>=11.50.0,<12", "mcp>=2,<3", "pillow", "starlette>=0.40", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.urls]
Homepage = "https://github.com/kats1123/homescreen-mcp"
Issues = "https://github.com/kats1123/homescreen-mcp/issues"

[project.scripts]
homescreen = "homescreen.cli:main"
homescreen-mcp = "homescreen.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["homescreen"]

[tool.setuptools.package-data]
homescreen = ["web/*"]
